// Dedicated build and native client world for schema-three room and attachment acceptance.
gradle.beforeProject { project ->
    if (project.path == ':') project.layout.buildDirectory.set(project.file('build/semantic-building-check'))
}
gradle.projectsEvaluated {
    rootProject.tasks.withType(Test).configureEach {
        maxHeapSize = '2G'
        if (rootProject.hasProperty('semanticSnapshot')) environment('ARCHITECT_SEMANTIC_SNAPSHOT', rootProject.file('build/semantic-building-acceptance/copied-world-baseline-library.json').absolutePath)
    }
    rootProject.extensions.getByName('neoForge').runs.configureEach {
        if (name == 'client') {
            gameDirectory.set(rootProject.file('build/semantic-building-client'))
            if (rootProject.hasProperty('semanticBuildingSmoke')) {
                systemProperty('architect.semanticBuildingSmoke', 'true')
                systemProperty('architect.semanticBuildingOutput', rootProject.file('build/semantic-building-acceptance').absolutePath)
                if (rootProject.hasProperty('semanticBuildingVerify')) systemProperty('architect.semanticBuildingVerify', 'true')
                programArguments.addAll('--quickPlaySingleplayer', 'Vorlagen', '--width', '1600', '--height', '900')
            }
        }
        if (name == 'gameTestServer') gameDirectory.set(rootProject.file('build/semantic-building-server'))
        jvmArgument('-Xmx4G')
    }
}
