gradle.projectsEvaluated {
    def p=gradle.rootProject
    def domain=p.sourceSets.create('graphstudioDomain')
    domain.java.setSrcDirs([])
    domain.kotlin.setSrcDirs(['src/main/kotlin'])
    domain.kotlin.include('de/teutonstudio/copycatarchitect/domain/**', 'de/teutonstudio/copycatarchitect/client/GraphDiagramModels.kt', 'de/teutonstudio/copycatarchitect/client/KilaGroupProjection.kt', 'de/teutonstudio/copycatarchitect/client/GroupGraphInterfaces.kt')
    domain.resources.setSrcDirs(['src/main/resources'])
    domain.compileClasspath=p.configurations.compileClasspath
    domain.runtimeClasspath=domain.output+domain.compileClasspath
    def checks=p.sourceSets.create('graphstudioDomainTest')
    checks.java.setSrcDirs([])
    checks.kotlin.setSrcDirs(['src/test/kotlin'])
    checks.kotlin.include('**/GraphstudioExchangeTest.kt','**/DirectAreaInputsTest.kt','**/SegmentBooleanTest.kt','**/SegmentArrangementTest.kt','**/DynamicAreaSegmentTest.kt','**/RoofsTest.kt','**/RoomArrangementTest.kt','**/BuildingTransformValuesTest.kt')
