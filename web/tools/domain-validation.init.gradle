        reports.junitXml.outputLocation=p.layout.buildDirectory.dir('test-results/graphstudio-browser-import')
        reports.html.outputLocation=p.layout.buildDirectory.dir('reports/tests/graphstudio-browser-import')
    }
    p.tasks.register('testGraphstudioDomain',Test) {
        testClassesDirs=checks.output.classesDirs
        classpath=checks.runtimeClasspath
        useJUnitPlatform()
        reports.junitXml.outputLocation=p.layout.buildDirectory.dir('test-results/graphstudio-authoring')
        reports.html.outputLocation=p.layout.buildDirectory.dir('reports/tests/graphstudio-authoring')
